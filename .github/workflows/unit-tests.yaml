name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache embedded Postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/cihealth/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-v17

      - name: Run unit tests
        run: make test
